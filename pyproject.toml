[project]
name = "rovidev-business-scraper"
version = "1.0.0"
description = "Price and availability monitor for public web pages: pluggable sources, robots.txt-aware, change detection and CSV/JSON/Sheets export."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "RoviDev", email = "contacto@rovidev.com" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
]

[project.optional-dependencies]
sheets = ["gspread>=6.1.0", "google-auth>=2.35.0"]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.urls]
Homepage = "https://rovidev.com"
Repository = "https://github.com/rovidev95/rovidev-business-scraper"

[project.scripts]
business-scraper = "scraper.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scraper*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
