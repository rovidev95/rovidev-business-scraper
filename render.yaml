services:
  - type: web
    name: rovidev-business-scraper
    runtime: python
    plan: free
    buildCommand: pip install -e .
    startCommand: uvicorn scraper.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SCRAPER_RESPECT_ROBOTS
        value: "true"
      - key: SCRAPER_MIN_INTERVAL
        value: "1.0"
